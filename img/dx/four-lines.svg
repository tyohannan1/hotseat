<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4200 900' width='4200' height='900'>
<svg x='0' y='0' viewBox='0 0 1400 900' width='1400' height='900' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>
<text x='700.0' y='46' text-anchor='middle' font-size='34' font-weight='700' fill='#e8eef5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>Line 1: the common iliac bifurcation</text>
<path d='M498 90 L498 300 Q498 330 470 350 L370 470 Q355 488 352 510 L320 720' stroke='#ff5a5a' stroke-width='14' fill='none' stroke-linejoin='round' stroke-linecap='round' opacity='1'/>
<path d='M542 90 L542 300 Q542 330 570 350 L670 470 Q685 488 688 510 L720 720' stroke='#ff5a5a' stroke-width='14' fill='none' stroke-linejoin='round' stroke-linecap='round' opacity='1'/>
<rect x='498' y='90' width='44' height='215' fill='#ff5a5a'/>
<path d='M370 470 L400 560 L410 640' stroke='#ff5a5a' stroke-width='9' fill='none' stroke-linejoin='round' stroke-linecap='round' opacity='1'/>
<path d='M670 470 L640 560 L630 640' stroke='#ff5a5a' stroke-width='9' fill='none' stroke-linejoin='round' stroke-linecap='round' opacity='1'/>
<text x='580' y='200' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>aorta</text>
<text x='635' y='420' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>common iliac</text>
<text x='725' y='640' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>external iliac</text>
<text x='560' y='620' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>internal iliac</text>
<line x1='230' y1='690' x2='370' y2='735' stroke='#18A3AC' stroke-width='3' stroke-linecap='round' stroke-dasharray='10 8'/>
<line x1='810' y1='690' x2='670' y2='735' stroke='#18A3AC' stroke-width='3' stroke-linecap='round' stroke-dasharray='10 8'/>
<text x='220' y='680' font-size='20' fill='#18A3AC' text-anchor='start' font-weight='400' font-style='italic'>inguinal ligament</text>
<line x1='190' y1='330' x2='850' y2='330' stroke='#9fb3c8' stroke-width='2' stroke-linecap='round' stroke-dasharray='6 8'/>
<text x='180' y='322' font-size='20' fill='#9fb3c8' text-anchor='end' font-weight='400'>aortic bifurcation</text>
<text x='180' y='344' font-size='20' fill='#9fb3c8' text-anchor='end' font-weight='400'>(L4)</text>
<line x1='190' y1='470' x2='850' y2='470' stroke='#FFDD00' stroke-width='5' stroke-linecap='round'/>
<text x='180' y='452' font-size='24' fill='#FFDD00' text-anchor='end' font-weight='700'>common iliac</text>
<text x='180' y='480' font-size='24' fill='#FFDD00' text-anchor='end' font-weight='700'>bifurcation</text>
<text x='180' y='506' font-size='18' fill='#FFDD00' text-anchor='end' font-weight='400' font-style='italic'>the edge of the pelvis</text>
<circle cx='460' cy='250' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='440' y='257' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>para-aortic</text>
<circle cx='410' cy='410' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='390' y='417' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>common iliac</text>
<circle cx='320' cy='600' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='300' y='607' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>external iliac</text>
<circle cx='425' cy='560' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='445' y='548' font-size='20' fill='#e8eef5' text-anchor='start' font-weight='400'>internal iliac</text>
<circle cx='295' cy='770' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='275' y='777' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>inguinal</text>
<text x='920' y='150' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Prostate</text>
<text x='920' y='200' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Below the line: N1, pelvic.</text>
<text x='920' y='232' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>Radiated with the prostate, curative.</text>
<text x='920' y='285' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Above the line: M1a, metastatic.</text>
<text x='920' y='317' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>Hormones and drugs lead.</text>
<text x='920' y='400' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Bladder</text>
<text x='920' y='450' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Common iliac is still regional (N3).</text>
<text x='920' y='482' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>The line does not matter here.</text>
<text x='920' y='565' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Lymphoma</text>
<text x='920' y='615' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>One iliac chain = one region.</text>
<text x='920' y='647' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>“Right iliac” and stop.</text>
<text x='920' y='740' font-size='22' fill='#18A3AC' text-anchor='start' font-weight='400'>Report: the vessel the node sits on, and which side</text>
<text x='920' y='770' font-size='22' fill='#18A3AC' text-anchor='start' font-weight='400'>of the bifurcation.</text>
</svg>

<svg x='1400' y='0' viewBox='0 0 1400 900' width='1400' height='900' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>
<text x='700.0' y='46' text-anchor='middle' font-size='34' font-weight='700' fill='#e8eef5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>Line 2: the left lateral wall of the trachea</text>
<text x='470' y='110' font-size='20' fill='#9fb3c8' text-anchor='middle' font-weight='400' font-style='italic'>anterior</text>
<text x='120' y='438' font-size='26' fill='#9fb3c8' text-anchor='middle' font-weight='700'>R</text>
<text x='820' y='438' font-size='26' fill='#9fb3c8' text-anchor='middle' font-weight='700'>L</text>
<ellipse cx='470' cy='660' rx='95' ry='60' fill='none' stroke='#5d7288' stroke-width='3'/>
<ellipse cx='485' cy='540' rx='40' ry='26' fill='none' stroke='#5d7288' stroke-width='3'/>
<text x='485' y='547' font-size='16' fill='#9fb3c8' text-anchor='middle' font-weight='400'>esophagus</text>
<circle cx='470' cy='430' r='70' fill='none' stroke='#e8eef5' stroke-width='5'/>
<text x='470' y='438' font-size='20' fill='#e8eef5' text-anchor='middle' font-weight='400'>trachea</text>
<circle cx='320' cy='390' r='40' fill='none' stroke='#5d7288' stroke-width='3'/>
<text x='320' y='397' font-size='18' fill='#9fb3c8' text-anchor='middle' font-weight='400'>SVC</text>
<circle cx='640' cy='440' r='48' fill='none' stroke='#5d7288' stroke-width='3'/>
<text x='640' y='447' font-size='18' fill='#9fb3c8' text-anchor='middle' font-weight='400'>aorta</text>
<circle cx='430' cy='280' r='48' fill='none' stroke='#5d7288' stroke-width='3'/>
<text x='430' y='287' font-size='16' fill='#9fb3c8' text-anchor='middle' font-weight='400'>asc. aorta</text>
<line x1='470' y1='170' x2='470' y2='750' stroke='#9fb3c8' stroke-width='2' stroke-linecap='round' stroke-dasharray='8 8'/>
<text x='478' y='165' font-size='18' fill='#9fb3c8' text-anchor='start' font-weight='400'>midline</text>
<line x1='540' y1='170' x2='540' y2='750' stroke='#FFDD00' stroke-width='5' stroke-linecap='round'/>
<text x='550' y='165' font-size='22' fill='#FFDD00' text-anchor='start' font-weight='700'>left lateral wall of the trachea</text>
<text x='355' y='330' font-size='24' fill='#e8eef5' text-anchor='middle' font-weight='700'>2R / 4R</text>
<text x='605' y='330' font-size='24' fill='#e8eef5' text-anchor='middle' font-weight='700'>2L / 4L</text>
<rect x='210' y='200' width='330' height='300' fill='#ffb000' fill-opacity='0.06' stroke='none'/>
<rect x='542' y='200' width='200' height='300' fill='#18A3AC' fill-opacity='0.08' stroke='none'/>
<circle cx='510' cy='335' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='510' y='315' font-size='20' fill='#ffb000' text-anchor='middle' font-weight='700'>still 4R</text>
<circle cx='590' cy='410' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='590' y='390' font-size='20' fill='#ffb000' text-anchor='middle' font-weight='700'>4L</text>
<circle cx='360' cy='400' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='360' y='380' font-size='20' fill='#ffb000' text-anchor='middle' font-weight='700'>4R</text>
<text x='920' y='150' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Lung cancer</text>
<text x='920' y='200' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Same side as the tumor: N2.</text>
<text x='920' y='232' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>Surgery may still be on the table.</text>
<text x='920' y='285' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Opposite side: N3.</text>
<text x='920' y='317' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>Surgery off; chemoradiation.</text>
<text x='920' y='370' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>The side is set by the left tracheal wall,</text>
<text x='920' y='400' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>not the midline. Station 7 is midline</text>
<text x='920' y='430' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>and always counts as N2.</text>
<text x='920' y='520' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Lymphoma</text>
<text x='920' y='570' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>The whole mediastinum is one region.</text>
<text x='920' y='602' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>Right or left changes nothing; size does.</text>
<text x='920' y='700' font-size='20' fill='#18A3AC' text-anchor='start' font-weight='400'>2 vs 4: above or below the top of the aortic arch</text>
<text x='920' y='728' font-size='20' fill='#18A3AC' text-anchor='start' font-weight='400'>(on the right, the innominate vein crossing).</text>
<text x='920' y='790' font-size='22' fill='#18A3AC' text-anchor='start' font-weight='400'>Report: the station number, not the position.</text>
</svg>

<svg x='2800' y='0' viewBox='0 0 1400 900' width='1400' height='900' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>
<text x='700.0' y='46' text-anchor='middle' font-size='34' font-weight='700' fill='#e8eef5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>Line 3: the pectoralis minor</text>
<text x='200' y='120' font-size='20' fill='#9fb3c8' text-anchor='start' font-weight='400' font-style='italic'>medial (sternum)</text>
<text x='760' y='120' font-size='20' fill='#9fb3c8' text-anchor='end' font-weight='400' font-style='italic'>lateral (arm)</text>
<text x='480' y='100' font-size='20' fill='#9fb3c8' text-anchor='middle' font-weight='400' font-style='italic'>anterior</text>
<path d='M120 560 Q420 470 760 560' stroke='#5d7288' stroke-width='8' fill='none' stroke-linejoin='round' stroke-linecap='round' opacity='1'/>
<text x='440' y='700' font-size='18' fill='#9fb3c8' text-anchor='middle' font-weight='400'>chest wall</text>
<path d='M130 300 Q450 180 780 330' stroke='#e8eef5' stroke-width='14' fill='none' stroke-linejoin='round' stroke-linecap='round' opacity='0.9'/>
<text x='450' y='230' font-size='20' fill='#e8eef5' text-anchor='middle' font-weight='400'>pectoralis major</text>
<path d='M300 470 L620 330' stroke='#FFDD00' stroke-width='12' fill='none' stroke-linejoin='round' stroke-linecap='round' opacity='1'/>
<text x='470' y='380' font-size='22' fill='#FFDD00' text-anchor='middle' font-weight='700'>pectoralis minor</text>
<text x='640' y='322' font-size='16' fill='#9fb3c8' text-anchor='start' font-weight='400'>coracoid</text>
<line x1='620' y1='150' x2='620' y2='560' stroke='#FFDD00' stroke-width='2' stroke-linecap='round' stroke-dasharray='8 8'/>
<line x1='300' y1='150' x2='300' y2='560' stroke='#FFDD00' stroke-width='2' stroke-linecap='round' stroke-dasharray='8 8'/>
<ellipse cx='520' cy='440' rx='34' ry='20' fill='none' stroke='#18A3AC' stroke-width='3'/>
<text x='520' y='447' font-size='14' fill='#18A3AC' text-anchor='middle' font-weight='400'>ax. vein</text>
<text x='700' y='610' font-size='26' fill='#e8eef5' text-anchor='middle' font-weight='700'>Level I</text>
<text x='700' y='638' font-size='18' fill='#9fb3c8' text-anchor='middle' font-weight='400'>lateral to pec minor</text>
<text x='460' y='610' font-size='26' fill='#e8eef5' text-anchor='middle' font-weight='700'>Level II</text>
<text x='460' y='638' font-size='18' fill='#9fb3c8' text-anchor='middle' font-weight='400'>behind pec minor</text>
<text x='210' y='610' font-size='26' fill='#e8eef5' text-anchor='middle' font-weight='700'>Level III</text>
<text x='210' y='638' font-size='18' fill='#9fb3c8' text-anchor='middle' font-weight='400'>medial to pec minor</text>
<text x='460' y='300' font-size='20' fill='#e8eef5' text-anchor='middle' font-weight='400'>Rotter's (interpectoral)</text>
<circle cx='460' cy='325' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<circle cx='700' cy='450' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<circle cx='430' cy='440' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<circle cx='210' cy='430' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<circle cx='150' cy='350' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='150' y='380' font-size='16' fill='#9fb3c8' text-anchor='middle' font-weight='400'>internal mammary</text>
<text x='880' y='150' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Breast cancer</text>
<text x='880' y='200' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Level I or II: the surgeon's axilla.</text>
<text x='880' y='232' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>Sentinel node or dissection.</text>
<text x='880' y='285' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Level III (infraclavicular): cN3a.</text>
<text x='880' y='317' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>Systemic therapy before any surgery.</text>
<text x='880' y='370' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>Rotter's: not reached by a standard</text>
<text x='880' y='400' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>dissection; radiation covers it only if named.</text>
<text x='880' y='450' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>Internal mammary: cN3b. Supraclavicular: cN3c.</text>
<text x='880' y='540' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Lymphoma</text>
<text x='880' y='590' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Axillary/pectoral is one region;</text>
<text x='880' y='622' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>infraclavicular is another. Count regions.</text>
<text x='880' y='720' font-size='22' fill='#18A3AC' text-anchor='start' font-weight='400'>Report: the level by its relation to pectoralis minor,</text>
<text x='880' y='750' font-size='22' fill='#18A3AC' text-anchor='start' font-weight='400'>and say Rotter's, internal mammary and</text>
<text x='880' y='780' font-size='22' fill='#18A3AC' text-anchor='start' font-weight='400'>supraclavicular by name.</text>
</svg>

</svg>
