<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 900' width='1400' height='900' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>

<path d='M375 150 L370 520 L395 640 L405 720 L455 720 L465 640 L490 520 L485 150' stroke='#e8eef5' stroke-width='5' fill='none' stroke-linejoin='round' stroke-linecap='round' opacity='1'/>
<path d='M280 140 Q255 400 320 600 L370 650' stroke='#18A3AC' stroke-width='3' fill='none' stroke-linejoin='round' stroke-linecap='round' stroke-dasharray='10 8' opacity='1'/>
<path d='M580 140 Q605 400 540 600 L490 650' stroke='#18A3AC' stroke-width='3' fill='none' stroke-linejoin='round' stroke-linecap='round' stroke-dasharray='10 8' opacity='1'/>
<text x='270' y='130' font-size='20' fill='#18A3AC' text-anchor='end' font-weight='400' font-style='italic'>mesorectal fascia</text>
<text x='430' y='340' font-size='22' fill='#9fb3c8' text-anchor='middle' font-weight='400'>rectum</text>
<text x='430' y='690' font-size='18' fill='#9fb3c8' text-anchor='middle' font-weight='400'>anal</text>
<text x='430' y='710' font-size='18' fill='#9fb3c8' text-anchor='middle' font-weight='400'>canal</text>
<line x1='330' y1='640' x2='530' y2='640' stroke='#FFDD00' stroke-width='5' stroke-linecap='round'/>
<text x='540' y='646' font-size='24' fill='#FFDD00' text-anchor='start' font-weight='700'>dentate line</text>
<line x1='200' y1='560' x2='370' y2='630' stroke='#5d7288' stroke-width='4' stroke-linecap='round'/>
<line x1='660' y1='560' x2='490' y2='630' stroke='#5d7288' stroke-width='4' stroke-linecap='round'/>
<text x='190' y='552' font-size='18' fill='#9fb3c8' text-anchor='end' font-weight='400'>levator</text>
<circle cx='325' cy='300' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='305' y='307' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>mesorectal</text>
<circle cx='230' cy='380' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='210' y='387' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>internal iliac / obturator</text>
<circle cx='180' cy='250' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='160' y='257' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>external iliac</text>
<circle cx='215' cy='760' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='195' y='767' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>inguinal</text>
<circle cx='645' cy='760' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<circle cx='630' cy='380' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<circle cx='535' cy='300' r='9' fill='#ffb000' stroke='#000' stroke-width='1.5'/>
<text x='820' y='150' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Anal canal SCC</text>
<text x='820' y='200' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>Regional: inguinal, mesorectal, internal iliac (N1a)</text>
<text x='820' y='234' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>Regional: external iliac (N1b)</text>
<text x='820' y='268' font-size='22' fill='#9fb3c8' text-anchor='start' font-weight='400'>All of them are already inside the radiation field.</text>
<text x='820' y='350' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Rectal adenocarcinoma</text>
<text x='820' y='400' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>Regional: mesorectal, internal iliac, obturator</text>
<text x='820' y='434' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>Distant (M1): external iliac, common iliac</text>
<text x='820' y='468' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>Inguinal: regional only if the tumor reaches</text>
<text x='820' y='502' font-size='22' fill='#e8eef5' text-anchor='start' font-weight='400'>   below the dentate line; otherwise M1</text>
<text x='820' y='580' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Lymphoma</text>
<text x='820' y='630' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Pelvic and inguinal are different regions,</text>
<text x='820' y='662' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>but one node in either is the same stage.</text>
<text x='820' y='760' font-size='22' fill='#18A3AC' text-anchor='start' font-weight='400'>Report: name the node group, and whether the primary</text>
<text x='820' y='790' font-size='22' fill='#18A3AC' text-anchor='start' font-weight='400'>sits above or below the dentate line.</text>
</svg>
