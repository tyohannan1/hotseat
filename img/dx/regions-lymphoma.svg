<text x='278' y='797' font-size='20' fill='#e8eef5' text-anchor='end' font-weight='400'>popliteal</text>
<ellipse cx='635' cy='790' rx='14' ry='14' fill='#ffb000' fill-opacity='0.28' stroke='#ffb000' stroke-width='2.5'/>
<text x='278' y='213' font-size='18' fill='#9fb3c8' text-anchor='end' font-weight='400'>occipital / preauricular</text>
<text x='980' y='150' font-size='30' fill='#e8eef5' text-anchor='start' font-weight='700'>Lymphoma counts regions</text>
<text x='980' y='200' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Inside a region, position does not matter:</text>
<text x='980' y='236' font-size='24' fill='#9fb3c8' text-anchor='start' font-weight='400'>  “iliac” is a complete word,</text>
<text x='980' y='272' font-size='24' fill='#9fb3c8' text-anchor='start' font-weight='400'>  “axillary” is a complete word.</text>
<text x='980' y='308' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'></text>
<text x='980' y='344' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Stage I: one region.</text>
<text x='980' y='380' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Stage II: two or more, same side of the diaphragm.</text>
<text x='980' y='416' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Stage III: both sides of the diaphragm.</text>
<text x='980' y='452' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Stage IV: non-contiguous extranodal disease.</text>
<text x='980' y='488' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'></text>
<text x='980' y='524' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>Bulk and the number of regions matter.</text>
<text x='980' y='560' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>None of today’s four lines moves a node</text>
<text x='980' y='596' font-size='24' fill='#e8eef5' text-anchor='start' font-weight='400'>between regions.</text>
<text x='980' y='700' font-size='18' fill='#9fb3c8' text-anchor='start' font-weight='400' font-style='italic'>Ann Arbor regions as used by the Lugano classification (Cheson 2014).</text>
</svg>
